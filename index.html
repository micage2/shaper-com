<!DOCTYPE html>
<html>

<head>
    <title>Data Modeling System</title>
    <style>
        /* Light mode (default) */
        :root {
            color-scheme: light dark;

            /* Global CSS Variables */
            --primary-color: #3498db;
            --main-font-size: 12px;
            --main-bg-color: #f0f0f0;
            --main-color: #f0f0f0;
            --focus-ring: 1px solid var(--primary);

            /* Global Styles */
            font-family: Arial, sans-serif;
            background-color: var(--main-bg-color);
        }

        /* Dark mode override */
        :root[data-theme="dark"] {
            --bg: #0f172a;
            --text: #e1e5e9;
            --surface: #1e293b;
            --primary: #c0c5ca;
            --border: #ccc;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #262728;
                --text: #e1e5e9;
                --surface: #1e293b;
                --primary: #c0c5ca;
                --border: #444;
                --border2: #ccc;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
        }

        input:focus-visible,
        button:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: var(--focus-ring);
            outline-offset: 0px;
        }
    </style>
</head>

<body>
    <script type="module" src="./src/app/app2.js"></script>
</body>

</html>
