<style>
    :host {
        --cell-height: 28px;
        --cell-border: 1px solid #eee;
        --cell-border-right: 1px solid #ddd;

        display: block;
        width: 100%;
        height: 100%;
        overflow: auto;
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 13px;
        background: #fff;
    }

    .grid {
        display: flex;
        min-width: 100%;
        width: max-content;
    }

    .column {
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        min-width: 120px;
        position: relative;
    }


    .cell-header {
        height: 28px;
        min-height: 28px;
        padding-left: 16px;
        padding-right: 16px;
        border-bottom: 1px solid #ccc;
        border-right: 1px solid #ddd;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        background: #f5f5f5;
        font-weight: bold;
        position: relative;
        user-select: none;
    }

    .cell-header .col-label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }



    .cell-simple {
        height: 28px;
        min-height: 28px;
        padding: 0 8px;
        border-bottom: 1px solid #eee;
        border-right: 1px solid #ddd;
        white-space: nowrap;
        overflow: hidden;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        user-select: none;
    }

    .resizer {
        position: absolute;
        top: 0;
        right: -2px;
        width: 4px;
        height: 100%;
        cursor: col-resize;
        z-index: 20;
        background: #dce5ef;
        opacity: 0;
        transition: opacity 0.3s ease 0.2s;
    }

    .resizer:hover {
        background: #7a9bc7;
        opacity: 1;
        transition: opacity 0.15s ease;
    }

    .sort-btn {
        position: absolute;
        right: 0px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.6rem;
        color: #94a3b8;
        padding: 2px 4px;
        opacity: 0;
        transition: opacity 0.3s ease 0.2s;
        z-index: 21;
    }

    .cell-header:hover .sort-btn {
        opacity: 1;
    }

    .sort-btn.active {
        opacity: 1;
        color: #2563eb;
    }

    .sort-btn:hover {
        color: #1d4ed8;
    }

    ::slotted(.cell-view) {
        height: 28px;
        border-bottom: 1px solid #eee;
        border-right: 1px solid #ddd;
        box-sizing: border-box;
    }
</style>
<div class="grid"></div>
